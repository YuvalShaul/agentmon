# Grafana's three sources: https://grafana.com/docs/grafana/latest/datasources/
# A log line links to its trace in Jaeger, and a span links to its log lines in Loki.

apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    url: http://prometheus:9090
    isDefault: true
  - name: Loki
    uid: loki
    type: loki
    url: http://loki:3100
    jsonData:
      derivedFields:
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: jaeger
          url: "$${__value.raw}"
  - name: Jaeger
    uid: jaeger
    type: jaeger
    url: http://jaeger:16686
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        # Loki keeps trace_id beside the line, not in its text: a filter on the field, not a text search.
        customQuery: true
        query: '{service_name="crew"} | trace_id="$${__trace.traceId}"'
        spanStartTimeShift: "-1m"
        spanEndTimeShift: "1m"
