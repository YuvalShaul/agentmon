# agentmon: a crew of AI agents, and the programs that observe it.
#
# The crew always makes its logs, spans and metrics. Which programs run to
# collect, store and show them is set by COMPOSE_PROFILES (see operator/stages/).

services:

  # --- the world outside: a fake model API and a fake search API -------------------------
  model-api:
    build: world
    environment: { ROLE: model }
    ports: ["127.0.0.1:8081:8080"]      # for operator/fault
  search-api:
    build: world
    environment: { ROLE: search }
    ports: ["127.0.0.1:8082:8080"]

  # --- the crew ----------------------------------------------------------------------------
  crew:
    build: crew
    container_name: crew
    # opentelemetry-instrument starts the OpenTelemetry SDK, set by the OTEL_* variables.
    command: ["opentelemetry-instrument", "python", "-u", "main.py"]
    environment:
      MODEL_API: http://model-api:8080/v1
      SEARCH_API: http://search-api:8080
      WATCHDOG_URL: ${WATCHDOG_URL:-}
      OTEL_SERVICE_NAME: crew
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-none}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-none}
      OTEL_METRICS_EXPORTER: none           # metrics go to Prometheus, from /metrics
      OTEL_EXPORTER_OTLP_ENDPOINT: http://opentelemetry-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED: "true"
      CREWAI_DISABLE_TELEMETRY: "true"     # no data to CrewAI's own servers
      CREWAI_TRACING_ENABLED: "false"
    ports:
      - "8000:8000"                         # /metrics
      - "8001:8001"                         # /health
    depends_on: [model-api, search-api]

  # --- traces and logs: the OpenTelemetry Collector, Jaeger, Loki -------------------------
  # The OpenTelemetry Collector: https://opentelemetry.io/docs/collector/
  opentelemetry-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    profiles: [traces]
    command: ["--config=/etc/opentelemetry-collector.yaml"]
    volumes: ["./stack/opentelemetry-collector.yaml:/etc/opentelemetry-collector.yaml:ro"]

  # Jaeger: https://www.jaegertracing.io/docs/
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    profiles: [traces]
    ports: ["16686:16686"]                  # the UI

  # Loki: https://grafana.com/docs/loki/latest/
  loki:
    image: grafana/loki:3.7.0
    profiles: [traces]
    command: ["-config.file=/etc/loki.yaml"]
    volumes: ["./stack/loki.yaml:/etc/loki.yaml:ro"]

  # --- metrics: Prometheus ------------------------------------------------------------------
  # Prometheus: https://prometheus.io/docs/
  prometheus:
    image: prom/prometheus:v3.15.1
    profiles: [metrics]
    volumes: ["./stack/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  # --- reading all three: Grafana -------------------------------------------------------------
  # Grafana: https://grafana.com/docs/grafana/latest/
  grafana:
    image: grafana/grafana:13.3.0
    profiles: [grafana]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"     # no login: a local demo
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/crew.json
    volumes: ["./stack/grafana:/etc/grafana/provisioning:ro"]
    ports: ["3000:3000"]

  # --- the watchdog ---------------------------------------------------------------------------
  watchdog:
    build: watchdog
    profiles: [watchdog]
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]   # to restart or stop the crew
